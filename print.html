<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print</title>
  <link rel="stylesheet" href="./api/katex.min.css">
  <link rel="stylesheet" href="./api/katex-fonts.css">
  <style>
    @font-face {
      font-family: "Inter";
      src: url("./fonts/inter/Inter-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Inter";
      src: url("./fonts/inter/Inter-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: "Inter";
      src: url("./fonts/inter/Inter-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: "JetBrains Mono";
      src: url("./fonts/jetbrains/JetBrainsMono-Regular.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    body, button, input, textarea, select {
      font-family: "Inter", sans-serif;
    }

    body.font-jetbrains,
    body.font-jetbrains button,
    body.font-jetbrains input,
    body.font-jetbrains textarea,
    body.font-jetbrains select,
    body.font-jetbrains .markdown-body,
    body.font-jetbrains .markdown-body p,
    body.font-jetbrains .markdown-body h1,
    body.font-jetbrains .markdown-body h2,
    body.font-jetbrains .markdown-body h3,
    body.font-jetbrains .markdown-body h4,
    body.font-jetbrains .markdown-body h5,
    body.font-jetbrains .markdown-body h6,
    body.font-jetbrains .markdown-body li,
    body.font-jetbrains .markdown-body blockquote,
    body.font-jetbrains .markdown-body td,
    body.font-jetbrains .markdown-body th,
    body.font-jetbrains .markdown-body span:not(.katex *):not(.katex),
    body.font-jetbrains .toc-container,
    body.font-jetbrains .toc-title,
    body.font-jetbrains .toc-list,
    body.font-jetbrains .toc-item a {
      font-family: "JetBrains Mono", monospace !important;
    }

    .katex {
      font-family: KaTeX_Main, 'Times New Roman', serif !important;
    }

    .katex * {
      font-family: inherit;
    }

    .katex .mathnormal {
      font-family: KaTeX_Math, 'Times New Roman', serif !important;
      font-style: italic !important;
    }

    .katex .mathit {
      font-family: KaTeX_Main, 'Times New Roman', serif !important;
      font-style: italic !important;
    }

    .katex .mathrm {
      font-family: KaTeX_Main, 'Times New Roman', serif !important;
      font-style: normal !important;
    }

    .katex .mathbf {
      font-family: KaTeX_Main, 'Times New Roman', serif !important;
      font-weight: 700 !important;
    }

    .katex .amsrm,
    .katex .mathbb,
    .katex .textbb {
      font-family: KaTeX_AMS, 'Times New Roman', serif !important;
    }

    .katex .delimsizing.size1,
    .katex .op-symbol.small-op {
      font-family: KaTeX_Size1, 'Times New Roman', serif !important;
    }

    .katex .delimsizing.size2,
    .katex .op-symbol.large-op {
      font-family: KaTeX_Size2, 'Times New Roman', serif !important;
    }

    body {
      margin: 0;
      background-color: white;
      color: black;
      padding: 20px;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .markdown-body {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    pre {
      background-color: #f6f8fa !important;
      border: 1px solid #e1e4e8 !important;
      border-radius: 6px !important;
      padding: 14px 16px !important;
      overflow: auto !important;
      white-space: pre-wrap !important;
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
      word-break: break-word !important;
      text-align: left !important;
      break-inside: avoid;
      page-break-inside: avoid;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    code {
      font-size: 85%;
      font-family: "JetBrains Mono", monospace !important;
      background-color: rgba(27, 31, 35, 0.05);
      border-radius: 4px;
      padding: 0.2em 0.4em;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      text-align: left;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    pre code {
      background-color: transparent !important;
      padding: 0 !important;
      font-size: 13px !important;
      font-family: "JetBrains Mono", monospace !important;
    }

    /* Syntax Highlighting in PDF (Always Included) */
    .hljs {
      color: #24292e !important;
      background: transparent !important;
      font-family: "JetBrains Mono", monospace !important;
    }
    .hljs-comment, .hljs-punctuation { color: #6a737d !important; font-style: italic !important; }
    .hljs-keyword, .hljs-selector-tag, .hljs-subst { color: #d73a49 !important; font-weight: 600 !important; }
    .hljs-string, .hljs-title, .hljs-section, .hljs-attribute, .hljs-attr, .hljs-literal, .hljs-template-tag, .hljs-template-variable, .hljs-type { color: #032f62 !important; }
    .hljs-variable, .hljs-title.class_, .hljs-title.function_, .hljs-property { color: #6f42c1 !important; }
    .hljs-number { color: #005cc5 !important; }
    .hljs-meta, .hljs-built_in { color: #e36209 !important; }
    .hljs-tag, .hljs-name { color: #22863a !important; }
    .hljs-deletion { color: #b31d28 !important; background-color: #ffeef0 !important; }
    .hljs-addition { color: #22863a !important; background-color: #f0fff4 !important; }

    img:not(.badge-img) {
      max-width: 70%;
      height: auto;
      display: block;
      margin: 1em auto;
    }

    img.badge-img {
      display: inline-block !important;
      vertical-align: middle !important;
      margin: 2px 3px !important;
      max-width: 100% !important;
      width: auto !important;
      height: auto !important;
      border: none !important;
    }

    a.badge-link,
    a:has(> img.badge-img) {
      display: inline-block !important;
      vertical-align: middle !important;
      line-height: 1 !important;
      margin: 2px 2px !important;
    }

    p.badge-paragraph {
      display: flex !important;
      flex-wrap: wrap !important;
      align-items: center !important;
      gap: 4px 6px !important;
      margin: 0.5rem 0 !important;
    }

    [align="center"] p.badge-paragraph,
    div[align="center"] p.badge-paragraph {
      justify-content: center !important;
    }

    img.img-small,
    img[data-size="small"] {
      width: 25% !important;
      max-width: 25% !important;
      height: auto !important;
      display: block !important;
      margin: 1em auto !important;
    }

    img.img-medium,
    img[data-size="medium"] {
      width: 50% !important;
      max-width: 50% !important;
      height: auto !important;
      display: block !important;
      margin: 1em auto !important;
    }

    img.img-large,
    img[data-size="large"] {
      width: 75% !important;
      max-width: 75% !important;
      height: auto !important;
      display: block !important;
      margin: 1em auto !important;
    }

    img.img-full,
    img[data-size="full"] {
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      display: block !important;
      margin: 1em auto !important;
    }

    ul,
    ol,
    li {
      text-align: left;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    blockquote {
      margin: 14px 0 16px 0;
      padding: 12px 16px;
      border-left: 3.5px solid #222;
      border-top: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
      border-radius: 0 6px 6px 0;
      color: #4b5563;
      background: #fbfbfb;
      break-inside: avoid;
      font-style: normal;
      line-height: 1.5;
    }

    blockquote p {
      margin: 0 0 6px 0;
    }

    blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Callout / Alert in PDF */
    blockquote.callout-alert {
      position: relative;
      border-left: 4px solid var(--callout-color, #10b981) !important;
      border-top: 1px solid var(--callout-border, rgba(16, 185, 129, 0.25));
      border-right: 1px solid var(--callout-border, rgba(16, 185, 129, 0.25));
      border-bottom: 1px solid var(--callout-border, rgba(16, 185, 129, 0.25));
      background-color: var(--callout-bg, rgba(16, 185, 129, 0.05));
      border-radius: 0 6px 6px 0;
      padding: 12px 16px;
      margin: 14px 0 16px 0;
      color: #111;
      break-inside: avoid;
    }

    .callout-header {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      color: var(--callout-color, #10b981);
    }

    .callout-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .callout-icon svg {
      width: 15px;
      height: 15px;
    }

    .callout-title {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.88rem;
    }

    .callout-content {
      color: #374151;
      line-height: 1.5;
    }

    .callout-content p {
      margin: 0 0 6px 0;
    }

    .callout-content p:last-child {
      margin-bottom: 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      background: #fff;
      border: 1px solid #d0d7de;
      font-size: 16px;
    }

    th,
    td {
      border: 1px solid #d0d7de;
      padding: 8px 12px;
      text-align: left;
    }

    th[align="left"],
    td[align="left"] {
      text-align: left;
    }

    th[align="center"],
    td[align="center"] {
      text-align: center;
    }

    th[align="right"],
    td[align="right"] {
      text-align: right;
    }

    th[align="justify"],
    td[align="justify"] {
      text-align: justify;
    }

    [align="left"] {
      text-align: left;
    }

    [align="center"] {
      text-align: center;
    }

    [align="right"] {
      text-align: right;
    }

    [align="justify"] {
      text-align: justify;
    }

    h1, h2, h3, h4, h5, h6 {
      text-align: left;
    }

    th {
      background: #f6f8fa;
      font-weight: 600;
      color: #24292f;
    }

    tr:nth-child(even) {
      background: #f6f8fa;
    }

    tr:hover {
      background: #eaeef2;
    }

    @media print {
      body {
        height: auto;
        overflow: visible;
      }

      .markdown-body {
        height: auto;
      }

      .page-break {
        page-break-before: always;
        break-before: page;
      }

      li {
        break-inside: avoid;
      }

      figure,
      img {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .table-of-contents {
        page-break-after: always;
      }

      table {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }

    .katex {
      font-size: 1.1em;
    }

    .katex-display-container {
      display: block;
      width: 100%;
      text-align: center;
      margin: 1.2em 0;
      page-break-inside: avoid;
    }

    .katex-display {
      display: block;
      margin: 1.2em 0;
      text-align: center !important;
      font-size: 1.15em;
      page-break-inside: avoid;
    }

    .katex-display > .katex {
      display: block !important;
      text-align: center !important;
      white-space: nowrap;
    }

    .katex-display > .katex > .katex-html {
      display: block;
      position: relative;
      text-align: center;
    }

    .katex-src {
      display: none;
    }

    .table-of-contents {
      margin-bottom: 2em;
      page-break-after: avoid;
    }

    .table-of-contents h2 {
      font-size: 1.5em;
      margin-bottom: 1em;
      color: #333;
    }

    .toc-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .toc-sublist {
      list-style: none;
      padding-left: 1.5em;
      margin: 0.5em 0;
    }

    .toc-item {
      margin: 0.3em 0;
      line-height: 1.4;
    }

    .toc-link {
      color: #0366d6;
      text-decoration: none;
      display: block;
      padding: 0.2em 0;
    }

    .toc-link:hover {
      text-decoration: underline;
    }

    .toc-level-1 .toc-link {
      font-weight: 600;
      font-size: 1em;
    }

    .toc-level-2 .toc-link {
      font-weight: 500;
      font-size: 0.95em;
    }

    .toc-level-3 .toc-link {
      font-weight: normal;
      font-size: 0.9em;
    }

    .toc-level-4,
    .toc-level-5,
    .toc-level-6 {
      font-size: 0.85em;
    }

    .toc-separator {
      margin: 2em 0;
      border: none;
      border-top: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <div id="content" class="markdown-body"></div>

  <script>
    const { ipcRenderer } = require('electron');

    function processMdImage(html) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;

      const imgs = tempDiv.querySelectorAll('img');

      imgs.forEach(img => {
        if (img.classList.contains('badge-img')) return;
        let alt = img.getAttribute('alt') || '';
        const originalAlt = alt.replace(/\u00A0/g, ' ').trim();

        let sizeClass = '';
        let cleanedAlt = originalAlt;

        if (img.classList.contains('img-small') || img.getAttribute('data-size') === 'small' || /\[small\]/i.test(originalAlt) || /^small$/i.test(originalAlt)) {
          sizeClass = 'img-small';
          cleanedAlt = originalAlt.replace(/\[small\]/ig, '').replace(/^small$/ig, '').trim();
        } else if (img.classList.contains('img-medium') || img.getAttribute('data-size') === 'medium' || /\[medium\]/i.test(originalAlt) || /^medium$/i.test(originalAlt)) {
          sizeClass = 'img-medium';
          cleanedAlt = originalAlt.replace(/\[medium\]/ig, '').replace(/^medium$/ig, '').trim();
        } else if (img.classList.contains('img-large') || img.getAttribute('data-size') === 'large' || /\[large\]/i.test(originalAlt) || /^large$/i.test(originalAlt)) {
          sizeClass = 'img-large';
          cleanedAlt = originalAlt.replace(/\[large\]/ig, '').replace(/^large$/ig, '').trim();
        } else if (img.classList.contains('img-full') || img.getAttribute('data-size') === 'full' || /\[full\]/i.test(originalAlt) || /^full$/i.test(originalAlt)) {
          sizeClass = 'img-full';
          cleanedAlt = originalAlt.replace(/\[full\]/ig, '').replace(/^full$/ig, '').trim();
        }

        if (sizeClass) {
          img.classList.add(sizeClass);
          img.setAttribute('data-size', sizeClass.replace('img-', ''));
          if (cleanedAlt) {
            img.setAttribute('alt', cleanedAlt);
          } else {
            img.removeAttribute('alt');
          }
        }
      });

      return tempDiv.innerHTML;
    }

    function generateTableOfContentsForPDF(content, exportSettings) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = content;

      const firstNode = tempDiv.firstChild;
      if (firstNode && firstNode.nodeType === Node.COMMENT_NODE &&
        firstNode.textContent.trim().match(/^\s*TOC\s*$/i)) {
        firstNode.remove();
      }

      if (tempDiv.querySelector('.table-of-contents')) {
        return content;
      }

      const headings = tempDiv.querySelectorAll('h1, h2, h3, h4, h5, h6');

      if (headings.length === 0) {
        return tempDiv.innerHTML;
      }

      const isIt = (exportSettings && exportSettings.lang === 'it') || document.documentElement.lang === 'it';
      const tocTitle = isIt ? 'Indice dei Contenuti' : 'Table of Contents';
      let tocHTML = `<div class="table-of-contents"><h2 class="toc-title">${tocTitle}</h2><ul class="toc-list">`;

      let currentLevel = 0;
      let openLists = 0;

      headings.forEach((heading, index) => {
        const level = parseInt(heading.tagName.substring(1));
        const title = heading.textContent;
        const anchor = `heading-${index}`;

        heading.id = anchor;

        if (level > currentLevel) {
          while (currentLevel < level) {
            if (currentLevel > 0) {
              tocHTML += '<ul class="toc-sublist">';
              openLists++;
            }
            currentLevel++;
          }
        } else if (level < currentLevel) {
          while (currentLevel > level) {
            if (openLists > 0) {
              tocHTML += '</ul>';
              openLists--;
            }
            currentLevel--;
          }
        }

        const indent = level - 1;
        tocHTML += `<li class="toc-item toc-level-${level}">
          <a href="#${anchor}" class="toc-link">${title}</a>
        </li>`;
      });

      while (openLists > 0) {
        tocHTML += '</ul>';
        openLists--;
      }

      tocHTML += '</ul><hr class="toc-separator"></div>';

      tempDiv.innerHTML = tocHTML + tempDiv.innerHTML;

      return tempDiv.innerHTML;
    }

    ipcRenderer.on('print-content', (event, content, exportSettings) => {
      const includeToc = Boolean(exportSettings && exportSettings.toc === true);
      let processedContent = includeToc ? generateTableOfContentsForPDF(content, exportSettings) : content;

      processedContent = processMdImage(processedContent);
      document.getElementById('content').innerHTML = processedContent;

      const fontFamily = (exportSettings && exportSettings.font) || 'inter';
      if (fontFamily === 'jetbrains') {
        document.body.classList.add('font-jetbrains');
      } else {
        document.body.classList.remove('font-jetbrains');
      }

      const sourceElements = document.querySelectorAll('span.katex-mathml');
      sourceElements.forEach(element => {
        element.classList.add('katex-src');
      });
      const imgs = Array.from(document.querySelectorAll('img'));
      const imagePromises = imgs.map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve; // Proceed even if image fails
        });
      });

      Promise.all([
        ...imagePromises,
        document.fonts ? document.fonts.ready : Promise.resolve()
      ]).then(() => {
        // Small buffer to ensure layout and fonts are fully settled
        setTimeout(() => {
          ipcRenderer.send('content-ready');
        }, 300);
      });
    });
  </script>
</body>

</html>
